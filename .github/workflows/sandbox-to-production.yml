name: Sandbox to production

# 1. A PR merged into staging (the Vercel sandbox) gets a matching
#    "Production: …" PR from the same branch into main. Merging that PR
#    is what ships it to providerinterface.com.
# 2. Later pushes to that branch are merged into staging too, so edits
#    show up on the sandbox and in the production PR at the same time.
#
# 3. If a production PR couldn't be opened, the staging PR gets a comment
#    saying why. Actions → Sandbox to production → Run workflow opens every
#    missing production PR (dry run by default).
#
# Opening PRs needs one of: the repo setting "Allow GitHub Actions to create
# and approve pull requests" (Settings → Actions → General → Workflow
# permissions), or a PRODUCTION_PR_TOKEN secret (fine-grained token with
# Pull requests + Contents read/write on this repo). The token is better:
# PRs opened with the default token don't trigger other workflows, so the
# Typecheck & Lint run on PRs to main only happens with the secret.
#
# Shell steps read PR fields from env vars, never ${{ }} inline.
#
# No workflow-level concurrency group: GitHub keeps only one pending run per
# group and cancels the rest, which silently dropped production PRs. Pushes
# to staging retry instead, since several runs can race for it.

on:
  pull_request:
    types: [closed]
    branches: [staging]
  push:
    branches-ignore: [main, staging]
  workflow_dispatch:
    inputs:
      days:
        description: "Look at PRs merged into staging in the last N days"
        default: "30"
      dry_run:
        description: "Only list what would be opened"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  open-production-pr:
    name: Open production PR
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PRODUCTION_PR_TOKEN || secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open or update the production PR
        run: .github/scripts/open-production-pr.sh "$HEAD_BRANCH" "$PR_NUMBER" "$PR_TITLE" merge

  open-missing-production-prs:
    name: Open missing production PRs
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PRODUCTION_PR_TOKEN || secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      DAYS: ${{ inputs.days }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open a production PR for each branch merged into staging that has none
        run: |
          since=$(date -u -d "$DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)
          # Newest merge per branch, same repo only, never main.
          gh pr list --repo "$REPO" --base staging --state merged --limit 200 \
            --json number,title,headRefName,isCrossRepository,mergedAt \
            -q "[.[] | select(.isCrossRepository | not) | select(.headRefName != \"main\") | select(.mergedAt >= \"$since\")]
                | sort_by(.mergedAt) | reverse | unique_by(.headRefName) | .[]
                | [.headRefName, (.number|tostring), .title] | @tsv" > candidates.tsv
          echo "Checking $(wc -l < candidates.tsv) branches merged into staging since $since (dry run: $DRY_RUN)." >> "$GITHUB_STEP_SUMMARY"
          failed=0
          while IFS=$'\t' read -r branch pr title; do
            .github/scripts/open-production-pr.sh "$branch" "$pr" "$title" backfill || failed=1
          done < candidates.tsv
          exit $failed

  sync-edits-to-staging:
    name: Send edits to the sandbox
    if: github.event_name == 'push' && github.event.deleted == false
    runs-on: ubuntu-latest
    concurrency:
      group: sandbox-sync-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - name: Find the production PR for this branch
        id: pr
        run: |
          n=$(gh pr list --repo "$REPO" --head "$BRANCH" --base main --state open \
            --json number,title,labels \
            -q '[.[] | select((.title | startswith("Production:")) or any(.labels[]; .name == "production"))][0].number // empty')
          echo "number=$n" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.pr.outputs.number != ''
        with:
          ref: staging
          fetch-depth: 0

      - name: Merge the branch into staging
        if: steps.pr.outputs.number != ''
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --quiet origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin staging
            git reset --quiet --hard origin/staging
            if git merge-base --is-ancestor "origin/$BRANCH" HEAD; then
              echo "staging already has $BRANCH." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if ! git merge --no-ff --no-edit -m "Sandbox: update from $BRANCH (#$PR_NUMBER)" "origin/$BRANCH"; then
              git merge --abort
              gh pr comment "$PR_NUMBER" --repo "$REPO" --body \
                "These edits conflict with staging, so the sandbox wasn't updated. Resolve it on a separate branch cut from \`staging\` (merge \`$BRANCH\` into it, fix, PR into \`staging\`). Don't merge \`staging\` into \`$BRANCH\` or use GitHub's conflict editor here — that would carry other sandbox work into production."
              exit 1
            fi
            if git push origin HEAD:staging; then
              echo "Merged $BRANCH into staging." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "staging kept moving; push failed 5 times." >> "$GITHUB_STEP_SUMMARY"
          exit 1
