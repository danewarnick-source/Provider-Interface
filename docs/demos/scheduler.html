<title>Scheduler for Group Homes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F4F3EF; --panel:#FFFFFF; --panel2:#ECEAE3; --ink:#16213A; --ink2:#3C4660; --muted:#6B7385;
  --line:#DDDBD3; --line2:#C6C3B8;
  --accent:#16213A; --accent-ink:#FFFFFF; --accent-soft:#E4E7EF;
  --gold:#B8901F; --gold-soft:#F6EFD8; --gold-ink:#5E4708;
  --ok:#237A47; --ok-soft:#DFF1E4; --warn:#9A6208; --warn-soft:#FBF0D6; --crit:#B23A2E; --crit-soft:#F9E2DE;
  --info:#2D5A9B; --info-soft:#E2EAF7;
  --shadow:0 1px 2px rgba(22,33,58,.06),0 10px 30px rgba(22,33,58,.06);
  --sans:'Plus Jakarta Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --rhs:#5B4B8A; --rhs-soft:#EBE6F5; --dsg:#1F6F8B; --dsg-soft:#DFEEF3; --slh:#2F7D5B; --slh-soft:#DFF0E7; --sei:#B0632A; --sei-soft:#F8E8DB; --com:#8A3A62; --com-soft:#F4E2EB; --hsq:#6B6B2A; --hsq-soft:#EEEDD8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#12161F; --panel:#1A2029; --panel2:#232B37; --ink:#ECEEF3; --ink2:#C4CAD6; --muted:#8E97A8;
    --line:#2C3542; --line2:#3E4857;
    --accent:#D9C27A; --accent-ink:#1A1A10; --accent-soft:#2E2F2A;
    --gold:#D9C27A; --gold-soft:#332E1C; --gold-ink:#F0E3B0;
    --ok:#6FC48E; --ok-soft:#173224; --warn:#E3B457; --warn-soft:#352A12; --crit:#F08A7E; --crit-soft:#3E1D19;
    --info:#8FB3EC; --info-soft:#1C2A42;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.3);
    --rhs:#B9A8E8; --rhs-soft:#2A2440; --dsg:#7CC3DB; --dsg-soft:#15303A; --slh:#7ED0A6; --slh-soft:#163428; --sei:#E8A271; --sei-soft:#3A2619; --com:#E39BC0; --com-soft:#3A1F2D; --hsq:#CFCF7A; --hsq-soft:#2F2F18;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#12161F; --panel:#1A2029; --panel2:#232B37; --ink:#ECEEF3; --ink2:#C4CAD6; --muted:#8E97A8;
  --line:#2C3542; --line2:#3E4857;
  --accent:#D9C27A; --accent-ink:#1A1A10; --accent-soft:#2E2F2A;
  --gold:#D9C27A; --gold-soft:#332E1C; --gold-ink:#F0E3B0;
  --ok:#6FC48E; --ok-soft:#173224; --warn:#E3B457; --warn-soft:#352A12; --crit:#F08A7E; --crit-soft:#3E1D19;
  --info:#8FB3EC; --info-soft:#1C2A42;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.3);
  --rhs:#B9A8E8; --rhs-soft:#2A2440; --dsg:#7CC3DB; --dsg-soft:#15303A; --slh:#7ED0A6; --slh-soft:#163428; --sei:#E8A271; --sei-soft:#3A2619; --com:#E39BC0; --com-soft:#3A1F2D; --hsq:#CFCF7A; --hsq-soft:#2F2F18;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
h1,h2,h3{margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:24px;line-height:1.15;font-weight:800}
h2{font-size:16px;line-height:1.25;font-weight:700}
h3{font-size:13.5px;font-weight:700}
p{margin:0}
.num{font-variant-numeric:tabular-nums}.mono{font-family:var(--mono)}
.muted{color:var(--muted)}.small{font-size:13px}.xs{font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:10px}

/* demo switch bar */
.demo{background:var(--ink);color:var(--bg);padding:8px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:13px}
:root[data-theme="dark"] .demo,.demo{background:#0E1320;color:#E8E6DC}
.demo b{letter-spacing:.08em;font-size:11px;opacity:.7}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink2)}
.seg button+button{border-left:1px solid var(--line2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.demo .seg{border-color:#3A4254;background:#1B2232}
.demo .seg button{color:#C9CDD8}
.demo .seg button[aria-pressed="true"]{background:#D9C27A;color:#1A1A10}

/* office shell */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100% - 42px)}
.nav{background:var(--panel);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:800;font-size:15px;letter-spacing:.02em}
.logo i{width:28px;height:28px;border-radius:7px;background:var(--ink);color:var(--gold);display:grid;place-items:center;font-style:normal;font-family:var(--mono);font-size:12px;font-weight:600}
:root[data-theme="dark"] .logo i{background:var(--gold);color:#1A1A10}
.nav a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:9px;color:var(--ink2);text-decoration:none;font-weight:600;font-size:13.5px}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.nav .sp{flex:1}
.nav .who{font-size:12px;color:var(--muted);padding:8px 10px;border-top:1px solid var(--line)}
main{padding:20px 24px 80px;min-width:0}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.pagehead .sub{color:var(--muted);font-size:13px;margin-top:4px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:9px 12px 10px;font-weight:700;font-size:13.5px;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--gold)}
.cnt{font-family:var(--mono);font-size:11px;padding:0 6px;border-radius:99px;line-height:17px;background:var(--panel2);color:var(--muted)}
.cnt.warn{background:var(--warn-soft);color:var(--warn)}.cnt.crit{background:var(--crit-soft);color:var(--crit)}.cnt.info{background:var(--info-soft);color:var(--info)}

.btn{border:1px solid var(--line2);background:var(--panel);border-radius:9px;padding:7px 12px;font-weight:700;font-size:13px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap;line-height:1.3}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:8px}
.btn.link{border:0;background:transparent;color:var(--info);padding:2px 4px}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ok{color:var(--ok);border-color:var(--ok)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 16px 10px;flex-wrap:wrap}
.ph .sub{font-size:12.5px;color:var(--muted);margin-top:2px;max-width:68ch}
.pb{padding:0 16px 16px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.pill{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:11.5px;border-radius:6px;padding:1px 7px;white-space:nowrap;line-height:18px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.crit{background:var(--crit-soft);color:var(--crit)}.pill.info{background:var(--info-soft);color:var(--info)}.pill.na{background:var(--panel2);color:var(--muted)}.pill.gold{background:var(--gold-soft);color:var(--gold-ink)}
.code{font-family:var(--mono);font-size:11px;font-weight:600;border-radius:5px;padding:0 5px;line-height:17px;display:inline-block;background:var(--panel2);color:var(--ink2)}
.code.RHS{background:var(--rhs-soft);color:var(--rhs)}.code.DSG{background:var(--dsg-soft);color:var(--dsg)}.code.DSI{background:var(--dsg-soft);color:var(--dsg)}.code.SLH{background:var(--slh-soft);color:var(--slh)}.code.SLN{background:var(--slh-soft);color:var(--slh)}.code.SEI{background:var(--sei-soft);color:var(--sei)}.code.COM{background:var(--com-soft);color:var(--com)}.code.HSQ{background:var(--hsq-soft);color:var(--hsq)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:11.5px;background:var(--accent-soft);color:var(--ink);flex:none}
.stat{padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat .v{font-size:24px;font-weight:800;line-height:1.1}
.stat .l{font-size:12.5px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line)}
.fbtn{border:1px solid var(--line2);background:var(--panel);border-radius:99px;padding:3px 11px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.fbtn[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
:root[data-theme="dark"] .fbtn[aria-pressed="true"]{background:var(--gold);color:#1A1A10;border-color:var(--gold)}

/* board */
.tw{overflow-x:auto}
.board{border-collapse:collapse;width:100%;min-width:900px}
.board th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.board th.today,.board td.today{background:var(--gold-soft)}
.board td{padding:6px 6px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);vertical-align:top;min-width:112px}
.board td:first-child{border-left:0;min-width:200px;padding:8px 10px}
.board tr:last-child td{border-bottom:0}
.rowname b{display:block;line-height:1.2}
.rowname span{font-size:12px;color:var(--muted);display:block}
.meter{height:5px;border-radius:99px;background:var(--panel2);overflow:hidden;width:100%;margin-top:6px}
.meter i{display:block;height:100%;border-radius:99px}
.chip{display:flex;flex-direction:column;gap:1px;border:1px solid var(--line2);border-left:4px solid var(--muted);border-radius:8px;padding:5px 7px;background:var(--panel);margin-bottom:5px;cursor:pointer;font-size:12.5px;line-height:1.3;text-align:left;width:100%}
.chip:hover{border-color:var(--ink)}
.chip b{font-family:var(--mono);font-weight:600;font-size:12px}
.chip span{color:var(--muted);font-size:11.5px}
.chip.RHS{border-left-color:var(--rhs)}.chip.DSG,.chip.DSI{border-left-color:var(--dsg)}.chip.SLH,.chip.SLN{border-left-color:var(--slh)}.chip.SEI{border-left-color:var(--sei)}.chip.COM{border-left-color:var(--com)}.chip.HSQ{border-left-color:var(--hsq)}
.chip.open{border-style:dashed;border-left-style:solid;border-left-color:var(--crit);background:var(--crit-soft)}
.chip.draft{border-style:dashed}
.chip.changed{box-shadow:inset 0 0 0 1px var(--gold)}
.chip.off{background:var(--panel2);border-left-color:var(--line2);cursor:default;color:var(--muted)}
.chip .flag{color:var(--warn);font-size:11px;font-weight:700}
.chip .bad{color:var(--crit);font-size:11px;font-weight:700}
.addc{border:1px dashed var(--line2);background:transparent;border-radius:8px;width:100%;padding:3px;color:var(--muted);font-size:12px}
.addc:hover{border-color:var(--ink);color:var(--ink)}
.gap{background:var(--crit-soft);color:var(--crit);border-radius:7px;padding:4px 7px;font-size:11.5px;font-weight:700;margin-bottom:5px}
.cov{display:flex;gap:2px;height:14px;border-radius:4px;overflow:hidden;margin-top:4px}
.cov i{display:block;flex:1}
.cov i.c{background:var(--ok)}.cov i.s{background:var(--crit)}.cov i.n{background:var(--panel2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:8px 16px;border-top:1px solid var(--line)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid var(--line2)}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mday{border:1px solid var(--line);border-radius:10px;padding:8px;min-height:96px;background:var(--panel);font-size:12px}
.mday b{display:block;font-size:12px;margin-bottom:4px}
.mday.today{background:var(--gold-soft)}
.mday .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}

/* needs you */
.need{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--panel);display:flex;flex-direction:column;gap:7px;margin-bottom:8px}
.need .tag{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.need .tag.crit{color:var(--crit)}.need .tag.warn{color:var(--warn)}.need .tag.info{color:var(--info)}
.need b{font-size:13.5px}
.need p{font-size:12.5px;color:var(--ink2)}
.fair{display:flex;flex-direction:column;gap:4px;font-size:12.5px;background:var(--panel2);border-radius:8px;padding:8px 10px}
.fair .r{display:flex;justify-content:space-between;gap:8px}

/* lists, tables */
.lst{list-style:none;margin:0;padding:0}
.lst li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.lst li:first-child{border-top:0}
.lst .s{display:block;font-size:12px;color:var(--muted);margin-top:1px}
table.t{border-collapse:collapse;width:100%}
table.t th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13.5px}
table.t tr:last-child td{border-bottom:0}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 16px;font-size:13.5px}
.kv .k{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;display:block}
.matrix td.c{text-align:center}
.cell{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;font-weight:800;font-size:12px}
.cell.ok{background:var(--ok-soft);color:var(--ok)}.cell.soon{background:var(--warn-soft);color:var(--warn)}.cell.late{background:var(--crit-soft);color:var(--crit)}.cell.na{color:var(--muted)}
.audit{font-size:13px;display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 12px;padding:8px 0;border-top:1px solid var(--line)}
.audit:first-child{border-top:0}
.audit .w{color:var(--muted);font-family:var(--mono);font-size:11.5px}
pre.csv{font-family:var(--mono);font-size:11.5px;background:var(--panel2);border-radius:8px;padding:10px;overflow-x:auto;margin:0;line-height:1.5}

/* forms */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lab{font-size:12.5px;font-weight:700}
.hint{font-size:12px;color:var(--muted)}
.inp{border:1px solid var(--line2);border-radius:9px;padding:8px 10px;background:var(--panel);width:100%;min-width:0}
.choice{display:flex;flex-wrap:wrap;gap:6px}
.choice button{border:1px solid var(--line2);background:var(--panel);border-radius:9px;padding:5px 10px;font-size:13px;font-weight:600;color:var(--ink2)}
.choice button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--ink);color:var(--ink)}
.choice button.x{text-decoration:line-through;opacity:.55}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cand{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:6px}
.cand.pick{border-color:var(--gold);background:var(--gold-soft)}
.cand .why{font-size:12px;color:var(--muted)}
.toggle{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.toggle:first-child{border-top:0}
.toggle .d{font-size:12.5px;color:var(--muted);display:block}
.rule{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rule:first-child{border-top:0}
.banner{border-radius:12px;padding:11px 13px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.banner.ok{background:var(--ok-soft)}.banner.warn{background:var(--warn-soft)}.banner.crit{background:var(--crit-soft)}.banner.info{background:var(--info-soft)}
.banner b{display:block}.banner p{font-size:13px;color:var(--ink2)}

/* drawer/dialog */
.scrim{position:fixed;inset:0;background:rgba(10,14,24,.5);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--bg);z-index:51;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.25);padding-top:env(safe-area-inset-top,0px)}
.dh{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dh .k{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.db{flex:1;overflow:auto;padding:16px 18px 30px;display:flex;flex-direction:column;gap:14px}
.df{background:var(--panel);border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.checks li{display:flex;gap:8px;font-size:13px;align-items:flex-start}
.checks li::before{content:"●";font-size:10px;margin-top:4px}
.checks li.ok::before{color:var(--ok)}.checks li.warn::before{color:var(--warn)}.checks li.bad::before{color:var(--crit)}.checks li.flag::before{color:var(--info)}
.msgs{display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;border-radius:12px 12px 12px 4px;padding:8px 11px;background:var(--panel2);font-size:13.5px}
.msg.me{align-self:flex-end;border-radius:12px 12px 4px 12px;background:var(--accent-soft)}
.msg .w{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.chan{display:flex;flex-direction:column;gap:2px}
.chan button{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:9px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.chan button[aria-current="true"]{background:var(--accent-soft)}

/* staff (responsive, not a frame) */
.staff{max-width:520px;margin:0 auto;padding:16px 16px 90px;min-height:calc(100% - 42px)}
.staff .top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.stabs{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:30}
.stabs button{border:0;background:transparent;font-size:11px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 8px;border-radius:8px;position:relative;min-width:56px}
.stabs button[aria-current="page"]{color:var(--ink)}
.stabs button i{font-style:normal;font-size:18px;line-height:1}

  if(cmd==='sendoff'){const days=Object.keys(ME.offdays||{}).filter(k=>ME.offdays[k]);if(!days.length){toast('Pick at least one day');return}REQ.push({id:'r'+(seq++),kind:'timeoff',staff:S.as,days,type:ME.offtype||'PTO',note:document.getElementById('offnote')?.value||'',status:'waiting'});ME.offdays={};render(true);toast('Sent. Rosa sees it in Needs you.');return}
  if(cmd==='sendfix'){const p=PUNCH.find(x=>x.id===arg);p.fix={by:S.as,out:ME.fixout||sh(p.shift).b,reason:document.getElementById('fixwhy')?.value||'Forgot to clock out'};log(STAFF[S.as].n,`Asked to fix punch: out ${hm(p.fix.out)} (${p.fix.reason})`);S.sheet=null;render(true);toast('Sent to Rosa. The original stays on record.');return}
  if(cmd==='eow'){STAFF[S.as].eow=arg==='1';render(true);toast('Saved');return}
  if(cmd==='maxh'){ME.maxh=Number(arg);render(true);toast('Saved. Offers stop at '+arg+' h.');return}
  if(cmd==='renewme'){STAFF[S.as].certs[arg]='2028-10-22';render(true);toast('Card uploaded. Rosa reviews it; your shifts are clear.');return}
});
document.addEventListener('change',e=>{const d=e.target.dataset;
  if(d.xt&&S.dlg&&S.dlg.x){const n=document.getElementById('gx_note');if(n)S.dlg.x.note=n.value;const[h,m]=e.target.value.split(':').map(Number);let v=h+m/60;if(d.xt==='b'&&v<=S.dlg.x.a)v+=24;S.dlg.x[d.xt]=v;render(true);return}
  if(d.wt&&S.dlg){const[h,m]=e.target.value.split(':').map(Number);let v=h+m/60;if(d.wt==='b'&&v<=S.dlg.w.a)v+=24;S.dlg.w[d.wt]=v;render(true)}
  if(d.cfgsel){CFG[d.cfgsel]=Number(e.target.value);render(true);toast('Saved')}
  if(d.prefsel){ME.prefs[d.prefsel]=Number(e.target.value);toast('Saved')}
});
document.addEventListener('input',e=>{const d=e.target.dataset;if(d.noteFor!==undefined&&S.sheet){const id=S.sheet.split(':')[1];ME.notes[id+d.noteFor]=e.target.value;const sv=document.getElementById('save'+d.noteFor);if(sv)sv.textContent='Saving…';clearTimeout(ME._t);ME._t=setTimeout(()=>{if(sv)sv.textContent='Saved';const b=document.querySelector('[data-act^="clockout"]');if(b){const s=sh(id);const subs=PLACES[s.place].kind==='home'?PLACES[s.place].res:[1];const ok=subs.every((r,i)=>(ME.notes[id+i]||'').split(/\s+/).filter(Boolean).length>=8);b.disabled=!ok;b.nextElementSibling.textContent=ok?'Location checked once at clock-out.':'Each note needs at least 8 words.'}},500)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.dlg||S.drawer){S.dlg=null;S.drawer=null;render(true)}else if(S.sheet){S.sheet=null;render(true)}}});
/* first render happens after settings load (p8) */
</script>
<script>
/* ---------- scheduling settings: agency defaults, per-place overrides ---------- */
const PLACE_OPTS=()=>Object.entries(PLACES).map(([k,p])=>[k,p.kind==='client'?p.n+' (client)':p.n]);
const pn=k=>PLACES[k]?(PLACES[k].kind==='client'?first(PLACES[k].n):PLACES[k].n):k==='community'?'Community':k;
const SETS=[['types','Shift types'],['rules','Rules'],['pay','Pay'],['open','Open shifts & hold-overs'],['approvals','Approvals'],['newhires','New hires'],['notify','Notifications'],['access','Who sees what']];
function lvSeg(rule,cur,state,attr){return `<span class="seg">${['off','warn','reason','block'].map(l=>`<button ${attr}="${rule}|${l}" aria-pressed="${cur===l}" ${state&&l==='off'?'disabled title="State rules always at least warn"':''}>${LVNAME[l]}</button>`).join('')}</span>`}
function sTypes(){
  return `<section class="panel"><div class="ph"><div><h2>Shift types</h2><p class="sub">What a shift is: its default times, whether it counts toward a home's coverage, and how it pays. Built-in types can be renamed and recolored; you can add your own.</p></div></div>
  <div class="tw"><table class="t"><thead><tr><th>Type</th><th>Default time</th><th>Used at</th><th>Counts toward coverage</th><th>Pay</th><th></th></tr></thead><tbody>${TYPES.map((t,i)=>`<tr><td><span class="row" style="gap:8px"><span style="width:12px;height:12px;border-radius:3px;background:${t.color};display:inline-block"></span><b>${esc(t.n)}</b>${t.sys?'':' '+pill('gold','Yours')}</span></td><td class="num mono">${span(t.a,t.b)}</td><td class="small">${t.kinds.map(k=>({home:'Homes',program:'Day programs',client:'Community'})[k]).join(', ')}</td><td><span class="seg"><button data-sa="tcov|${i}|1" aria-pressed="${t.cov}">Yes</button><button data-sa="tcov|${i}|0" aria-pressed="${!t.cov}">No</button></span></td><td class="small">${esc(TPAY[t.pay])}</td><td>${t.sys?'':`<button class="btn sm link" data-sa="tdel|${i}">Remove</button>`}</td></tr>`).join('')}</tbody></table></div>
  <div class="pb" style="padding-top:12px;border-top:1px solid var(--line)"><h3 style="margin-bottom:8px">Add a shift type</h3><div class="fgrid"><div class="field"><label for="nt_n">Name</label><input class="inp" id="nt_n" placeholder="e.g. Med pass, Split shift, Weekend outing"></div><div class="field"><label for="nt_c">Color</label><select class="inp" id="nt_c">${[['#8A3A62','Plum'],['#B0632A','Rust'],['#2F7D5B','Green'],['#2D5A9B','Blue'],['#6B6B2A','Olive']].map(c=>`<option value="${c[0]}">${c[1]}</option>`).join('')}</select></div><div class="field"><label>From / to</label><span class="row"><input class="inp" type="time" id="nt_a" value="17:00" style="width:auto"><span class="xs">to</span><input class="inp" type="time" id="nt_b" value="19:00" style="width:auto"></span></div><div class="field"><label for="nt_k">Used at</label><select class="inp" id="nt_k"><option value="home">Homes</option><option value="program">Day programs</option><option value="client">Community</option></select></div><div class="field"><label for="nt_cov">Counts toward coverage</label><select class="inp" id="nt_cov"><option value="1">Yes</option><option value="0">No (extra hands)</option></select></div><div class="field"><label for="nt_p">Pay</label><select class="inp" id="nt_p"><option value="normal">Hourly rate</option><option value="stipend">Flat stipend</option></select></div></div><div class="row" style="margin-top:10px"><button class="btn pri" data-sa="tadd">Add shift type</button></div></div></section>`;
}
function sRules(){
  return `<section class="panel"><div class="ph"><div><h2>Rules</h2><p class="sub">Each rule has an agency default and can be different at any home, program or client. <b>Off</b> ignores it. <b>Warn</b> shows it. <b>Needs a reason</b> lets you continue after writing why, and the reason is saved on the shift. <b>Block</b> stops the shift. State rules can't be turned off. Two shifts at the same time is always blocked.</p></div></div>
  <div class="pb">${RULES.map(r=>{const ov=OV[r.k]||{};return `<div style="padding:12px 0;border-top:1px solid var(--line)"><div class="row between" style="align-items:flex-start"><div style="max-width:52ch"><b>${esc(r.n)}</b> ${r.state?pill('info','State rule'):pill('na','Agency rule')}<div class="xs muted" style="margin-top:2px">${esc(r.d)}</div></div><div class="col" style="gap:6px;align-items:flex-end">${r.val?`<span class="row"><span class="xs muted">Threshold</span><span class="seg">${r.opts.map(o=>`<button data-sa="val|${r.val}|${o}" aria-pressed="${CFG[r.val]===o}">${o} ${r.unit.split(' ')[0]}</button>`).join('')}</span></span>`:''}<span class="row"><span class="xs muted">Agency default</span>${lvSeg(r.k,LV[r.k],r.state,'data-lv')}</span></div></div>
   <div class="row" style="margin-top:8px;gap:6px"><span class="xs muted">Different at:</span>${Object.entries(ov).map(([p,l])=>`<span class="pill ${l==='block'?'crit':l==='reason'?'warn':l==='off'?'na':'info'}">${esc(pn(p))}: ${LVNAME[l]} <button class="btn link" style="padding:0 0 0 4px;font-size:11px" data-sa="ovdel|${r.k}|${p}" aria-label="Remove override">✕</button></span>`).join('')||'<span class="xs muted">nowhere</span>'}<select class="inp" style="width:auto;padding:3px 6px;font-size:12px" id="ovp_${r.k}" aria-label="Place">${PLACE_OPTS().map(o=>`<option value="${o[0]}">${esc(o[1])}</option>`).join('')}</select><select class="inp" style="width:auto;padding:3px 6px;font-size:12px" id="ovl_${r.k}" aria-label="Strength">${['off','warn','reason','block'].filter(l=>!(r.state&&l==='off')).map(l=>`<option value="${l}">${LVNAME[l]}</option>`).join('')}</select><button class="btn sm" data-sa="ovadd|${r.k}">Add</button></div></div>`}).join('')}</div></section>`;
}
function sPay(){
  return `<div class="col" style="gap:16px">
  <section class="panel"><div class="ph"><div><h2>Overtime</h2><p class="sub">Used for the cost owners see, pay estimates on staff phones, and payroll later.</p></div></div><div class="pb"><div class="rule"><div><span class="lab">Workweek starts</span><span class="d">Overtime is counted per workweek, not per pay period.</span></div><span class="seg">${['Sun','Mon'].map((d,i)=>`<button data-sa="week0|${i}" aria-pressed="${PAY.week0===i}">${d}</button>`).join('')}</span></div><div class="rule"><div><span class="lab">Overtime after</span><span class="d">Set on the Rules tab (${CFG.ot} h a week). Paid at</span></div><span class="seg">${[1.5,2].map(m=>`<button data-sa="otm|${m}" aria-pressed="${PAY.otMult===m}">${m}×</button>`).join('')}</span></div></div></section>
  <section class="panel"><div class="ph"><div><h2>Overnight pay, per home</h2><p class="sub">Awake time logged during an asleep night always pays the normal rate. Excluding sleep time is only allowed on shifts of 24 hours or more.</p></div></div><div class="pb">${Object.entries(PLACES).filter(([k,p])=>p.kind==='home').map(([k,p])=>`<div class="rule"><div><span class="lab">${esc(p.n)}</span><span class="d">${PAY.overnight[k]==='sleeprate'?`Asleep hours pay $${PAY.sleepRate}/h`:PAY.overnight[k]==='exclude'?'Up to 8 asleep hours unpaid on 24 h+ shifts':'Every hour at the normal rate'}</span></div><span class="seg">${[['every','Pay every hour'],['sleeprate','Sleep rate'],['exclude','Exclude sleep (24 h+)']].map(o=>`<button data-sa="onight|${k}|${o[0]}" aria-pressed="${PAY.overnight[k]===o[0]}">${o[1]}</button>`).join('')}</span></div>`).join('')}<div class="rule"><div><span class="lab">Sleep rate</span><span class="d">For homes that use it</span></div><span class="seg">${[10,12,14].map(v=>`<button data-sa="sleeprate|${v}" aria-pressed="${PAY.sleepRate===v}">$${v}/h</button>`).join('')}</span></div><div class="rule"><div><span class="lab">On-call stipend</span><span class="d">Per on-call shift, plus hours if called in</span></div><span class="seg">${[25,40,60].map(v=>`<button data-sa="oncall|${v}" aria-pressed="${PAY.oncall===v}">$${v}</button>`).join('')}</span></div></div></section>
  <section class="panel"><div class="ph"><div><h2>Differentials</h2></div></div><div class="pb"><div class="rule"><div><span class="lab">Night differential</span><span class="d">${hm(PAY.night.a)}–${hm(PAY.night.b)}</span></div><span class="seg"><button data-sa="night|0" aria-pressed="${!PAY.night.on}">Off</button>${[0.5,1,1.5].map(v=>`<button data-sa="night|${v}" aria-pressed="${PAY.night.on&&PAY.night.amt===v}">+$${v.toFixed(2)}/h</button>`).join('')}</span></div><div class="rule"><div><span class="lab">Weekend differential</span><span class="d">Saturday and Sunday</span></div><span class="seg"><button data-sa="wknd|0" aria-pressed="${!PAY.weekend.on}">Off</button>${[0.5,1].map(v=>`<button data-sa="wknd|${v}" aria-pressed="${PAY.weekend.on&&PAY.weekend.amt===v}">+$${v.toFixed(2)}/h</button>`).join('')}</span></div>
   <h3 style="margin:12px 0 6px">Premiums for a home or client</h3><p class="xs muted" style="margin-bottom:6px">Extra per hour for hard-to-staff places. Shows on the open-shift card so staff see it.</p>${Object.entries(PLACES).map(([k,p])=>`<div class="rule"><div><span class="lab">${esc(p.n)}</span></div><span class="seg">${[0,1,1.5,2].map(v=>`<button data-sa="prem|${k}|${v}" aria-pressed="${(PREM[k]||0)===v}">${v?'+$'+v.toFixed(2):'None'}</button>`).join('')}</span></div>`).join('')}</div></section>
  <section class="panel"><div class="ph"><div><h2>Holidays</h2><p class="sub">Pick your agency's paid holidays and the rate.</p></div></div><div class="pb">${HOL.map((h,i)=>`<div class="rule"><div><span class="lab">${esc(h.n)}</span><span class="d">${md(h.date)}${h.date.slice(0,4)!=='2026'?', '+h.date.slice(0,4):''}</span></div><span class="row"><span class="seg"><button data-sa="hol|${i}|0" aria-pressed="${!h.on}">Not paid extra</button>${[1.5,2].map(m=>`<button data-sa="hol|${i}|${m}" aria-pressed="${h.on&&h.mult===m}">${m}×</button>`).join('')}</span></span></div>`).join('')}</div></section></div>`;
}
function sOpenSet(){
  const holds=Object.entries(HOLD).sort((a,b)=>(a[1].last||'0').localeCompare(b[1].last||'0'));
  return `<div class="col" style="gap:16px">
  <section class="panel"><div class="ph"><div><h2>Offering open shifts</h2><p class="sub">Open shifts go to everyone qualified at once: on the team, trained, cards current, not off, not already working, and under the agency cap.</p></div></div><div class="pb">
   <div class="rule"><div><span class="lab">Who gets it</span><span class="d">Agency default. A home can be different below.</span></div><span class="seg"><button data-sa="claim|first" aria-pressed="${CFG.claim==='first'}">First to claim</button><button data-sa="claim|approve" aria-pressed="${CFG.claim==='approve'}">Approver picks</button></span></div>
   ${Object.entries(APPROVE).map(([k,a])=>`<div class="rule"><div><span class="lab">${esc(pn(k))}</span><span class="d">Pickups: ${APNAME[a.pickup]}</span></div><span class="seg">${['auto','lead','owner'].map(v=>`<button data-sa="ap|${k}|pickup|${v}" aria-pressed="${a.pickup===v}">${v==='auto'?'First to claim':v==='lead'?'Lead approves':'Owner approves'}</button>`).join('')}</span></div>`).join('')}
   <div class="rule"><div><span class="lab">Quiet hours</span><span class="d">No offers in this window unless the shift starts soon.</span></div><span class="row"><select class="inp" style="width:auto" data-cfgsel="quietA">${[20,21,22].map(h=>`<option value="${h}" ${CFG.quietA===h?'selected':''}>${hm(h)}</option>`).join('')}</select><span class="xs">to</span><select class="inp" style="width:auto" data-cfgsel="quietB">${[6,7,8].map(h=>`<option value="${h}" ${CFG.quietB===h?'selected':''}>${hm(h)}</option>`).join('')}</select></span></div>
   <div class="rule"><div><span class="lab">Urgent means it starts within</span><span class="d">Urgent offers ignore quiet hours and go as a push.</span></div><span class="seg">${[2,4,8].map(v=>`<button data-sa="urgent|${v}" aria-pressed="${CFG.urgent===v}">${v} h</button>`).join('')}</span></div></div></section>
  <section class="panel"><div class="ph"><div><h2>When nobody picks it up</h2><p class="sub">If a home would be left without staff, the platform works down this list. Each step waits before moving on.</p></div></div><div class="pb">${ESC.map((e,i)=>`<div class="rule"><div><span class="lab">${i+1}. ${esc(e.who)}</span><span class="d">${i===0?'The lead for that home gets a call-style push':i===1?'Whoever is on-call that day':'The owner'}</span></div><span class="seg">${[5,15,30].map(v=>`<button data-sa="esc|${i}|${v}" aria-pressed="${e.wait===v}">${v} min</button>`).join('')}</span></div>`).join('')}<div class="rule"><div><span class="lab">${ESC.length+1}. Ask someone on shift to stay</span><span class="d">The person there who was held over longest ago is asked first. They can say no; the next person is asked. Never past the hours-in-a-row rule (${CFG.maxRow} h).</span></div><span class="seg"><button data-sa="holdask|1" aria-pressed="${CFG.holdAsk}">On</button><button data-sa="holdask|0" aria-pressed="${!CFG.holdAsk}">Off</button></span></div></div></section>
  <section class="panel"><div class="ph"><div><h2>Hold-over record</h2><p class="sub">Who stayed past their shift because no one else could come. Top of the list is asked first next time.</p></div><span class="row"><span class="xs muted">Staff can see this list</span><span class="seg"><button data-sa="holdvis|1" aria-pressed="${CFG.holdVisible}">Yes</button><button data-sa="holdvis|0" aria-pressed="${!CFG.holdVisible}">No</button></span></span></div><div class="tw"><table class="t"><thead><tr><th>Next up</th><th>Team member</th><th>Last held over</th><th>This month</th></tr></thead><tbody>${holds.map(([sid,h],i)=>`<tr><td class="num">${i+1}</td><td><b>${esc(STAFF[sid].n)}</b></td><td>${h.last?md(h.last):'Never'}</td><td class="num">${h.month}</td></tr>`).join('')}</tbody></table></div></section></div>`;
}
function sApprovals(){
  const cols=[['swap','Swaps'],['timeoff','Time off'],['fix','Punch fixes'],['publish','Publish the week']];
  return `<section class="panel"><div class="ph"><div><h2>Approvals, per home and program</h2><p class="sub">Each place names its lead and who approves what. The owner can always approve anything. Leads only see the homes they lead. Pickups are set on the Open shifts tab.</p></div></div><div class="tw"><table class="t"><thead><tr><th>Place</th><th>Lead</th>${cols.map(c=>`<th>${c[1]}</th>`).join('')}</tr></thead><tbody>${Object.entries(APPROVE).map(([k,a])=>`<tr><td><b>${esc(pn(k))}</b></td><td><select class="inp" style="width:auto;padding:4px 8px" data-apsel="${k}|lead"><option value="">No lead</option>${Object.entries(STAFF).filter(([sid,s])=>k==='community'||s.teams.includes(k)).map(([sid,s])=>`<option value="${sid}" ${a.lead===sid?'selected':''}>${esc(s.n)}</option>`).join('')}</select></td>${cols.map(c=>`<td><select class="inp" style="width:auto;padding:4px 8px" data-apsel="${k}|${c[0]}">${['lead','owner'].concat(c[0]==='timeoff'||c[0]==='publish'?[]:['auto']).map(v=>`<option value="${v}" ${a[c[0]]===v?'selected':''} ${v==='lead'&&!a.lead?'disabled':''}>${APNAME[v]}</option>`).join('')}</select></td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="xs muted" style="padding:10px 16px">Automatic for swaps means a swap between two people who are both qualified goes through without anyone approving it.</p></section>`;
}
function sNewhires(){
  const hires=Object.keys(NEWHIRE);
  return `<section class="panel"><div class="ph"><div><h2>New hires</h2><p class="sub">New hires work paired shifts until the Evidence items that block working alone are on file, then a lead signs them off for each home. The sign-off is saved with the lead's name.</p></div></div><div class="pb">
   <div class="rule"><div><span class="lab">Paired shifts count toward coverage</span><span class="d">If no, a paired new hire is an extra set of hands and someone else must cover the home.</span></div><span class="seg"><button data-sa="tcov|${TYPES.findIndex(t=>t.id==='paired')}|1" aria-pressed="${TYPES.find(t=>t.id==='paired').cov}">Yes</button><button data-sa="tcov|${TYPES.findIndex(t=>t.id==='paired')}|0" aria-pressed="${!TYPES.find(t=>t.id==='paired').cov}">No</button></span></div>
   ${hires.map(sid=>{const st=STAFF[sid];return Object.keys(NEWHIRE[sid]).map(pk=>{const ok1=!!st.certs.core;const ok2=st.ps.includes(pk);const so=NEWHIRE[sid][pk];const lead=APPROVE[pk]&&APPROVE[pk].lead;return `<div class="panel" style="padding:12px;margin-top:12px"><div class="row between"><b>${esc(st.n)} · ${esc(pn(pk))}</b>${so?pill('ok','Cleared to work alone'):pill('warn','Paired shifts only')}</div><ul class="checks" style="margin-top:8px"><li class="${ok1?'ok':'bad'}">30-day orientation ${ok1?'on file in Evidence':'not on file'}</li><li class="${ok2?'ok':'bad'}">Person-specific training for ${esc(pn(pk))} ${ok2?'on file in Evidence':'not on file'}</li><li class="${so?'ok':'warn'}">${so?`Signed off by ${esc(so.by)} on ${md(so.on)}`:`Waiting on a sign-off from ${lead?esc(STAFF[lead].n)+' (lead)':'the owner'}`}</li></ul><div class="row" style="margin-top:8px">${so?`<button class="btn sm" data-sa="signoff|${sid}|${pk}|0">Undo sign-off</button>`:`<button class="btn sm pri" data-sa="signoff|${sid}|${pk}|1" ${ok1&&ok2?'':'disabled'}>Sign off as ${lead?esc(first(STAFF[lead].n)):'owner'}</button>${ok1&&ok2?'':'<span class="xs muted">Sign-off opens once both items are on file.</span>'}`}</div></div>`}).join('')}).join('')}</div></section>`;
}
function sNotify(){
  const tog=(k,lab,d,opts)=>`<div class="rule"><div><span class="lab">${lab}</span><span class="d">${d}</span></div><span class="seg">${opts.map(o=>`<button data-cfg="${k}:${o[0]}" aria-pressed="${String(CFG[k])===String(o[0])}">${o[1]}</button>`).join('')}</span></div>`;
  return `<section class="panel"><div class="ph"><div><h2>Notifications</h2><p class="sub">Agency defaults. Each team member can turn alerts down further from their phone, but can't turn off urgent ones.</p></div></div><div class="pb">
   ${tog('remind','Shift reminder','Push to the person, with who else is on.',[[60,'1 hour before'],[120,'2 hours'],[0,'Off']])}
   ${tog('digest','Schedule changes','Urgent ones (today or tomorrow) always go right away.',[[true,'One daily digest'],[false,'Each change']])}
   ${tog('locOnlyAtPunch','Location','Checked at clock-in and clock-out only.',[[true,'At punches only'],[false,'During the shift']])}</div></section>`;
}
function sAccess(){
  return `<section class="panel"><div class="ph"><div><h2>Who sees what</h2><p class="sub">Enforced on every screen, not just captioned.</p></div></div><div class="pb"><ul class="lst"><li><span>Staff cost and wages<span class="s">Board, place pages, pay settings</span></span><b class="small">Owner, Finance</b></li><li><span>Other people's schedules<span class="s">Team members see who else is on their own shifts, and the house schedule for places they're on</span></span><b class="small">Leads and up: their homes</b></li><li><span>Client details<span class="s">Only the people assigned to that client</span></span><b class="small">Assigned staff</b></li><li><span>Punch fixes<span class="s">Own punches: team member. Everyone's: the place's lead and the owner</span></span><b class="small">Lead, Owner</b></li><li><span>Hold-over record<span class="s">Set on Open shifts & hold-overs</span></span><b class="small">${CFG.holdVisible?'Everyone':'Leads and owner'}</b></li></ul></div></section>`;
}
function vSettings(){
  const cur=S.set||'rules';const V={types:sTypes,rules:sRules,pay:sPay,open:sOpenSet,approvals:sApprovals,newhires:sNewhires,notify:sNotify,access:sAccess};
  const nOv=Object.values(OV).reduce((n,o)=>n+Object.keys(o).length,0);
  return `<div class="pagehead"><div><h1>Scheduling settings</h1><p class="sub">Agency defaults first. Any home, program or client can be set differently, and each place's page lists what's different there. ${nOv} place-specific setting${nOv===1?'':'s'} today.</p></div></div>
  <div class="tabs">${SETS.map(x=>`<button data-set="${x[0]}" ${cur===x[0]?'aria-current="page"':''}>${x[1]}</button>`).join('')}</div>${V[cur]()}`;
}
function placeSettings(k){
  const rows=[];RULES.forEach(r=>{if(OV[r.k]&&OV[r.k][k])rows.push([r.n,`${LVNAME[OV[r.k][k]]} (agency: ${LVNAME[LV[r.k]]})`])});
  if(PAY.overnight[k])rows.push(['Overnight pay',PAY.overnight[k]==='sleeprate'?`Sleep rate $${PAY.sleepRate}/h`:PAY.overnight[k]==='exclude'?'Exclude sleep (24 h+)':'Every hour']);
  if(PREM[k])rows.push(['Premium',`+$${PREM[k].toFixed(2)}/h`]);
  const ap=APPROVE[k]||(PLACES[k].kind==='client'?APPROVE.community:null);if(ap)rows.push(['Lead and approvals',`${ap.lead?STAFF[ap.lead].n:'No lead'} · pickups ${APNAME[ap.pickup].toLowerCase()} · swaps ${APNAME[ap.swap].toLowerCase()}`]);
  return `<section class="panel" style="margin-top:16px"><div class="ph"><div><h2>Settings for ${esc(PLACES[k].n)}</h2><p class="sub">Only what's different from the agency defaults, plus this place's pay and approvers.</p></div><button class="btn sm" data-tab="settings">Change in Settings</button></div><div class="pb"><ul class="lst">${rows.map(r=>`<li><span>${esc(r[0])}</span><b class="small">${esc(r[1])}</b></li>`).join('')||'<li class="muted">Same as the agency defaults.</li>'}</ul></div></section>`;
}
const _vPlace=vPlace;vPlace=function(){return _vPlace()+placeSettings(S.place)};

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-set],[data-lv],[data-sa]');if(!t)return;const d=t.dataset;
  if(d.set){S.set=d.set;render(true);return}
  if(d.lv){const[r,l]=d.lv.split('|');LV[r]=l;render(true);toast(`${RULES.find(x=>x.k===r).n}: ${LVNAME[l]} by default. Places set differently keep their setting.`);return}
  const[c,a,b,x]=d.sa.split('|');
  const done=m=>{render(true);toast(m||'Saved')};
  if(c==='val'){CFG[a]=Number(b);return done()}
  if(c==='ovadd'){const p=document.getElementById('ovp_'+a).value,l=document.getElementById('ovl_'+a).value;(OV[a]=OV[a]||{})[p]=l;return done(`${pn(p)} now: ${LVNAME[l]}`)}
  if(c==='ovdel'){delete OV[a][b];return done(`${pn(b)} back to the agency default`)}
  if(c==='tcov'){TYPES[Number(a)].cov=b==='1';return done(`${TYPES[Number(a)].n} ${b==='1'?'counts':'doesn’t count'} toward coverage`)}
  if(c==='tdel'){TYPES.splice(Number(a),1);return done('Removed')}
  if(c==='tadd'){const n=document.getElementById('nt_n').value.trim();if(!n){toast('Give it a name');return}const tm=id=>{const[h,m]=document.getElementById(id).value.split(':').map(Number);return h+m/60};let A=tm('nt_a'),B=tm('nt_b');if(B<=A)B+=24;TYPES.push({id:'t'+(seq++),n,color:document.getElementById('nt_c').value,a:A,b:B,kinds:[document.getElementById('nt_k').value],cov:document.getElementById('nt_cov').value==='1',pay:document.getElementById('nt_p').value,sys:false});return done(`${n} added. It shows as a time choice when adding shifts there.`)}
  if(c==='week0'){PAY.week0=Number(a);return done()}
  if(c==='otm'){PAY.otMult=Number(a);return done()}
  if(c==='onight'){PAY.overnight[a]=b;return done(`${pn(a)} overnight pay updated`)}
  if(c==='sleeprate'){PAY.sleepRate=Number(a);return done()}
  if(c==='oncall'){PAY.oncall=Number(a);return done()}
  if(c==='night'){const v=Number(a);PAY.night.on=v>0;if(v)PAY.night.amt=v;return done()}
  if(c==='wknd'){const v=Number(a);PAY.weekend.on=v>0;if(v)PAY.weekend.amt=v;return done()}
  if(c==='prem'){const v=Number(b);if(v)PREM[a]=v;else delete PREM[a];return done()}
  if(c==='hol'){const h=HOL[Number(a)];const v=Number(b);h.on=v>0;if(v)h.mult=v;return done()}
  if(c==='claim'){CFG.claim=a;Object.values(APPROVE).forEach(x=>x.pickup=a==='first'?'auto':(x.lead?'lead':'owner'));return done()}
  if(c==='ap'){APPROVE[a][b]=x;return done()}
  if(c==='urgent'){CFG.urgent=Number(a);return done()}
  if(c==='esc'){ESC[Number(a)].wait=Number(b);return done()}
  if(c==='holdask'){CFG.holdAsk=a==='1';return done()}
  if(c==='holdvis'){CFG.holdVisible=a==='1';return done()}
  if(c==='signoff'){const lead=APPROVE[b]&&APPROVE[b].lead;NEWHIRE[a][b]=x==='1'?{by:lead?STAFF[lead].n+' (lead)':'Rosa Delgado',on:TISO}:null;log(lead?STAFF[lead].n:'Rosa Delgado',`${x==='1'?'Signed off':'Removed sign-off for'} ${STAFF[a].n} to work alone at ${pn(b)}`);return done(x==='1'?`${first(STAFF[a].n)} can work alone at ${pn(b)}. Open shifts there now go to them too.`:'Sign-off removed')}
});
document.addEventListener('change',e=>{const d=e.target.dataset;if(!S.dlg)return;const tv=v=>{const[h,m]=v.split(':').map(Number);return h+m/60};
  if(d.rtt!==undefined&&e.target.value){S.dlg.r.stops[Number(d.rtt)][2]=tv(e.target.value)}
  if(d.rtp!==undefined){S.dlg.r.stops[Number(d.rtp)][1]=e.target.value}
  if(d.awt&&e.target.value){S.dlg.x[d.awt]=tv(e.target.value);render(true)}});
let DRAG=null;
document.addEventListener('dragstart',e=>{const el=e.target.closest&&e.target.closest('[data-rti]');if(el){DRAG=Number(el.dataset.rti);e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{if(DRAG!==null&&e.target.closest&&e.target.closest('[data-rti]'))e.preventDefault()});
document.addEventListener('drop',e=>{const el=e.target.closest&&e.target.closest('[data-rti]');if(DRAG===null||!el)return;e.preventDefault();const to=Number(el.dataset.rti),st=S.dlg.r.stops;const[m]=st.splice(DRAG,1);st.splice(to,0,m);DRAG=null;render(true)});
document.addEventListener('dragend',()=>{DRAG=null});
document.addEventListener('change',e=>{const d=e.target.dataset;if(d.apsel){const[k,f]=d.apsel.split('|');APPROVE[k][f]=e.target.value||null;render(true);toast('Saved')}});
render();
</script>
