:root[data-theme="dark"]{
  color-scheme:dark;

  --line:#2C3542; --line2:#3E4857;
  --accent:#D9C27A; --accent-ink:#1A1A10; --accent-soft:#2E2F2A;
  --gold:#D9C27A; --gold-soft:#332E1C; --gold-ink:#F0E3B0;
  --ok:#6FC48E; --ok-soft:#173224; --warn:#E3B457; --warn-soft:#352A12; --crit:#F08A7E; --crit-soft:#3E1D19;
  --info:#8FB3EC; --info-soft:#1C2A42;
  --rhs:#B9A8E8; --rhs-soft:#2A2440; --dsg:#7CC3DB; --dsg-soft:#15303A; --mtp:#E0B57A; --mtp-soft:#3A2B17;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
h1,h2,h3{margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:22px;line-height:1.2;font-weight:800}
h2{font-size:16px;line-height:1.25;font-weight:700}
h3{font-size:13.5px;font-weight:700}
p{margin:0}
.mono{font-family:var(--mono)}.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:13px}.xs{font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:10px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.demo{background:var(--demo);color:var(--demo-ink);padding-block:8px;display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;font-size:13px}
.demo b{letter-spacing:.08em;font-size:11px;opacity:.7}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden;background:var(--panel);max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap}
.seg button+button{border-left:1px solid var(--line2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.demo .seg{border-color:var(--demo-line);background:var(--demo-btn)}
.demo .seg button{color:#C9CDD8}
.demo .seg button+button{border-left-color:var(--demo-line)}
.demo .seg button[aria-pressed="true"]{background:#D9C27A;color:#1A1A10}

.btn{border:1px solid var(--line2);background:var(--panel);border-radius:9px;padding:7px 12px;font-weight:700;font-size:13px;display:inline-flex;gap:6px;align-items:center;justify-content:center;white-space:nowrap;line-height:1.3}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:8px}
.btn.big{padding:12px 14px;font-size:14.5px;border-radius:12px;width:100%}
.btn.ok{color:var(--ok);border-color:var(--ok)}
.btn.link{border:0;background:transparent;color:var(--info);padding:2px 4px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:14px 16px 10px;flex-wrap:wrap}
.ph .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.pb{padding:0 16px 16px}
.pill{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:11.5px;border-radius:6px;padding:1px 7px;white-space:nowrap;line-height:18px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.crit{background:var(--crit-soft);color:var(--crit)}.pill.info{background:var(--info-soft);color:var(--info)}.pill.na{background:var(--panel2);color:var(--muted)}.pill.gold{background:var(--gold-soft);color:var(--gold-ink)}
.code{font-family:var(--mono);font-size:11px;font-weight:600;border-radius:5px;padding:0 5px;line-height:17px;display:inline-block;background:var(--panel2);color:var(--ink2)}
.code.RHS{background:var(--rhs-soft);color:var(--rhs)}.code.DSG,.code.DSP{background:var(--dsg-soft);color:var(--dsg)}.code.MTP{background:var(--mtp-soft);color:var(--mtp)}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:11.5px;background:var(--accent-soft);color:var(--ink);flex:none}
.ref{font-family:var(--mono);font-size:11px;color:var(--muted)}
.goal{display:inline-flex;gap:4px;align-items:center;font-size:11.5px;font-weight:700;color:var(--gold-ink);background:var(--gold-soft);border-radius:6px;padding:1px 7px;line-height:18px}

/* ---------- phone ---------- */
.phonewrap{display:flex;justify-content:center;padding-block:18px 60px}
.phone{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px}
.shiftcard{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.shiftcard .t{font-size:20px;font-weight:800;line-height:1.15}
.shiftcard .m{font-size:13px;opacity:.85}
.shiftcard .btn{background:var(--panel);color:var(--ink);border-color:var(--panel)}
.who{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.who:first-child{border-top:0}
.who .nm{flex:1;min-width:0}
.who .nm b{display:block;line-height:1.25}
.who .nm span{display:block;font-size:12px;color:var(--muted)}
.entry{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel);display:flex;flex-direction:column;gap:6px}
.entry .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.entry p{font-size:13.5px}
.tag{font-size:11.5px;font-weight:700;border-radius:99px;padding:0 8px;line-height:19px;background:var(--panel2);color:var(--ink2)}
.tag.house{background:var(--warn-soft);color:var(--warn)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,24,.45);z-index:40}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(560px,100%);max-height:88%;overflow:auto;background:var(--panel);border-radius:18px 18px 0 0;z-index:41;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.sheet .handle{width:40px;height:4px;border-radius:9px;background:var(--line2);align-self:center}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lab{font-size:12.5px;font-weight:700}
.hint{font-size:12px;color:var(--muted)}
.inp{border:1px solid var(--line2);border-radius:10px;padding:9px 11px;background:var(--panel);width:100%;min-width:0}
textarea.inp{resize:vertical;line-height:1.45}
.choice{display:flex;flex-wrap:wrap;gap:6px}
.choice button{border:1px solid var(--line2);background:var(--panel);border-radius:99px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--ink2)}
.choice button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.choice.g button[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-ink)}
.gate{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:13.5px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* ---------- office ---------- */
.shell{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:calc(100% - 44px)}
.nav{background:var(--panel);border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:3px}
.nav .logo{font-weight:800;padding:2px 10px 12px;font-size:14.5px}
.nav button{border:0;background:transparent;text-align:left;display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 10px;border-radius:9px;color:var(--ink2);font-weight:600;font-size:13.5px}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.cnt{font-family:var(--mono);font-size:11px;padding:0 6px;border-radius:99px;line-height:17px;background:var(--panel2);color:var(--muted)}
.cnt.warn{background:var(--warn-soft);color:var(--warn)}
main.om{padding-block:20px 80px;min-width:0;display:flex;flex-direction:column;gap:16px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.pagehead .sub{color:var(--muted);font-size:13px;margin-top:4px;max-width:70ch}
.tw{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;min-width:560px}
table.t th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13.5px}
table.t tr:last-child td{border-bottom:0}
.flag{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;padding:11px 14px;border-radius:12px;background:var(--crit-soft);color:var(--crit)}
.flag p{color:var(--ink2);font-size:13px}
.noteGrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.summary{font-size:15px;line-height:1.6;max-width:68ch}
.chk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.chk li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.chk li:first-child{border-top:0}
.chk .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.chk .ic.y{background:var(--ok-soft);color:var(--ok)}.chk .ic.n{background:var(--crit-soft);color:var(--crit)}
.chk .v{color:var(--muted);font-size:12px;display:block}
.tl{display:flex;flex-direction:column;gap:10px}
.tl .entry{border-left:4px solid var(--line2)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px 16px;font-size:13.5px}
.kv .k{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;display:block}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;width:120px}
.bar i{display:block;height:100%;background:var(--rhs);border-radius:99px}
.explain{font-size:12.5px;color:var(--muted);background:var(--panel2);border-radius:10px;padding:9px 12px;max-width:80ch}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding-block:8px}
  .nav .logo{display:none}
  .nav button{white-space:nowrap}
  .noteGrid{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

let MIN=20; // agency setting (agency-wide): minimum words per client, per shift

function dsgSpan(d){if(!d||d.absent)return [null,null];if(S.dsgMode==='van'||!d.am)return [d.in,d.out];return [d.am[3]??null,d.pm?d.pm[1]:null]}

const houseFor=(day,place)=>E.filter(e=>e.day===day&&e.place===place&&e.about==='house').sort((a,b)=>a.t-b.t);
const todayShift=me=>SHIFTS.find(s=>s.staff===me&&s.day==='thu');
const phrase=(e,c)=>{const p=e.phr&&e.phr[c];if(p)return p;const g=e.goals&&e.goals[c];if(e.resp)return `How ${fn(c)} responded${g?` (${CL[c].goals[g]})`:''}, per ${first(e.staff)}: “${e.text.trim()}”`;return g?`On “${CL[c].goals[g]}”, ${first(e.staff)} wrote: “${e.text.trim()}”`:`${first(e.staff)} wrote${e.group?' (group activity)':''}: “${e.text.trim()}”`};
function shiftLabel(s){return `${hs(s.a)}–${hs(s.b)}`}
function presentDuring(c,day,s){ // RHS: was the Person home during any part of this shift (this calendar day)?
 const a=RA[day+'|'+c];if(!a)return false;if(a.st==='absent'||!a.away)return true;

function required(s){
 if(s.place==='maple')return Object.keys(CL).filter(c=>CL[c].home==='maple'&&presentDuring(c,s.day,s));

const myEntries=(s,c)=>E.filter(e=>e.shift===s.id&&Array.isArray(e.about)&&e.about.includes(c));
const secOf=(s,c)=>{S.sec[s.id]=S.sec[s.id]||{};return S.sec[s.id][c]=S.sec[s.id][c]||{picked:[],txt:{}}};

function checks(day,c,code,place){
 const es=entriesFor(day,c,place),authors=[...new Set(es.map(e=>e.staff))];const L=[];
 L.push({l:'Person',ok:true,v:CL[c].n});
 L.push({l:'Date',ok:true,v:DAYS[day].n});
 L.push({l:'Service code',ok:true,v:code});
 if(code==='RHS'){
  const a=RA[day+'|'+c];
  L.push({l:'Staff name',ok:authors.length>0,v:authors.length?authors.map(x=>STAFF[x].n).join(', '):'No staff wrote about '+fn(c),ref:'§21.3(9)(D)'});
  L.push({l:'Daily summary note',ok:es.length>0,v:es.length?`From ${es.length} signed ${es.length===1?'entry':'entries'}`:'No entries yet',ref:'§21.3(9)(E)'});
  if(a&&a.st==='absent')L.push({l:'Absence day, date and reason',ok:!!a.why,v:a.why,ref:'§21.3(3)'});
 } else {
  const d=DG[day+'|'+c]||{};
  if(d.absent){L.push({l:'Absent from program',ok:true,v:d.why+' · not billed'});return L;}
  const [ds,de]=dsgSpan(d),lb=dsgLbl();
  L.push({l:'Start time',ok:ds!=null,v:ds!=null?hm(ds)+' ('+lb[0]+')':'Not yet',ref:'§7.3(6)(C)'});
  L.push({l:'End time',ok:de!=null,v:de!=null?hm(de)+' ('+lb[1]+')':'Not yet',ref:'§7.3(6)(C)'});
  L.push({l:'Assigned staff',ok:true,v:STAFF[assigned(day,c)].n});
  L.push({l:'Staff name',ok:authors.length>0,v:authors.length?authors.map(x=>STAFF[x].n).join(', '):'None',ref:'§7.3(6)(E)'});
  L.push({l:'Summary note',ok:es.length>0,v:es.length?`From ${es.length} signed ${es.length===1?'entry':'entries'}`:'No entries yet',ref:'§7.3(6)(F)'});
  if(CL[c].codes.includes('MTP')&&d.in!=null){
   const ok=!!(d.am&&d.am[3]!=null&&d.pm&&d.pm[3]!=null);L.push({l:'Van record (MTP)',ok,v:ok?`Pickup ${hm(d.am[1])}, drop-off ${hm(d.pm[2+1])}`:'Afternoon pickup and drop-off missing',ref:'§13.3(3)'});
  }
 }
 return L;
}
const nkey=(day,c,code)=>day+'|'+c+'|'+code;
function status(day,c,code,place){

 if(day==='thu')return 'open';
 if(S.approved[nkey(day,c,code)])return 'approved';
 if(entriesFor(day,c,place).some(e=>e.sb))return 'sentback';

function staffLine(day,c,place){

function summaryText(day,c,code,place){
 const k=nkey(day,c,code);if(S.edited[k])return S.edited[k].text;
 const P=CL[c],es=entriesFor(day,c,place),nm=fn(c);let out=[];
 if(code==='RHS'){
  const a=RA[day+'|'+c];
  if(a&&a.st==='absent')out.push(`${nm} stayed home at ${PLACES[place].n} and missed day program (absence day: ${a.why.toLowerCase()}).`);
  else if(a&&a.away)out.push(`${nm} was home at ${PLACES[place].n} except ${hs(a.away[0])}–${hs(a.away[1])}, when ${P.pr[1]} was at ${a.why}.`);

  const [ds,de]=dsgSpan(d),lb=dsgLbl();out.push(`${nm} attended ${PLACES[place].n}${ds!=null?` from ${hm(ds)} (${lb[0]})`:''}${de!=null?` to ${hm(de)} (${lb[1]})`:''}.`);
 }

 const R=S.run,riders=ROUTE.filter(c=>assigned('thu',c)===s.staff);const d=c=>DG['thu|'+c];
 const steps=[['am','Pickups'],['day','Program'],['pm','Drop-offs']];const si=['am','day','pm','done'].indexOf(R.stage);
 const bar=`<div class="row" style="gap:6px">${steps.map(([k,l],i)=>`<span class="pill ${i<si?'ok':i===si?'gold':'na'}">${i<si?'✓ ':''}${l}</span>`).join('')}</div>`;
 const addr=c=>CL[c].homeAddr;
 const stop=(c,leg)=>{const x=d(c),mv=S.move['thu|'+c];
  if(x.absent)return `<div class="who"><div class="av">${ini(CL[c].n)}</div><div class="nm"><b>${esc(CL[c].n)}</b><span>${esc(addr(c))}</span><span>Not coming: ${esc(x.why)}</span></div>${pill('warn','Absent')}</div>`;
  const done=leg==='am'?x.in!=null:x.out!=null;
  const sub=leg==='am'?(done?`Picked up ${hm(x.in)}${S.dsgMode==='van'?' · DSG started':''}`:'Waiting'):(done?`Dropped off ${hm(x.out)}${S.dsgMode==='van'?' · DSG ended':''}`:'On the van');
  const btns=done?pill('ok','✓'):leg==='am'?`<span class="row" style="gap:6px"><button class="btn sm pri" data-act="pick:${c}">Picked up</button><button class="btn sm" data-sheet="nocome:${c}">Not coming</button></span>`:`<button class="btn sm pri" data-act="drop:${c}">Dropped off</button>`;
  return `<div class="who"><div class="av">${ini(CL[c].n)}</div><div class="nm"><b>${esc(CL[c].n)}</b><span>${esc(addr(c))}</span><span>${sub}</span>${mv&&leg==='am'?`<span style="color:var(--info)">${esc(mv.why)}</span>`:''}</div>${btns}</div>`};
 let body='';
 if(R.stage==='am'){const left=riders.filter(c=>!d(c).absent&&d(c).in==null).length;
  body=`${riders.map(c=>stop(c,'am')).join('')}<div class="field" style="margin-top:10px"><span class="lab">Then drop everyone at</span><div class="choice">${['Lehi Day Program','Community outing: Lehi Rec Center'].map(x=>`<button data-dest="${x}" aria-pressed="${R.dest===x}">${x}</button>`).join('')}</div></div>
  <button class="btn pri big" data-act="arrive" ${left||!R.dest?'disabled':''} style="margin-top:8px">${left?`${left} stop${left>1?'s':''} left`:`Arrived at ${R.dest?esc(R.dest.replace('Community outing: ','')):'…'}`}</button>`;}
 if(R.stage==='day'){const on=riders.filter(c=>d(c).in!=null&&!d(c).absent);
  body=`<p class="small">At <b>${esc(R.dest)}</b> since ${hm(R.arrive)}. ${on.map(c=>`${esc(fn(c))} (since ${hm(d(c).in)})`).join(', ')}.</p><p class="xs muted">Write your notes below during the day. When you load the van:</p><button class="btn pri big" data-act="leave" style="margin-top:8px">Heading home: start drop-offs</button>`;}
 if(R.stage==='pm')body=riders.filter(c=>!d(c).absent).slice().reverse().map(c=>stop(c,'pm')).join('');
 if(R.stage==='done')body=`<p class="small">Route done. Every pickup and drop-off is on the van record (§13.3(3)).</p>`;
 return `<div class="panel"><div class="ph"><div><h2>My van today</h2><p class="sub">Your riders are your group. Each tap saves the time and place. ${S.dsgMode==='van'?'DSG runs from each person\'s pickup to their drop-off':'DSG runs from Arrived to Heading home'} (agency setting).</p></div></div><div class="pb col" style="gap:10px">${bar}<div>${body}</div></div></div>`;
}
function vEntry(e,mineView){

   <section class="panel"><div class="ph"><div><h2>Contract check</h2><p class="sub">${cd==='RHS'?'SOW §21.3(9)':'SOW §7.3(6)'} fields for this note</p></div></div>
    <div class="pb"><ul class="chk">${L.map(x=>`<li><span class="ic ${x.ok?'y':'n'}">${x.ok?'✓':'!'}</span><span><b>${x.l}</b><span class="v">${esc(x.v)}${x.ref?' · '+x.ref:''}</span></span></li>`).join('')}</ul></div></section>
   ${st==='ready'?`<button class="btn pri big" data-act="approve:${k}">Approve as ${STAFF[PLACES[place].lead].n}</button>`:st==='approved'?`<div class="explain">Approved by ${STAFF[PLACES[place].lead].n}. Locked for billing; later changes are added as amendments.</div>`:st==='open'?`<div class="explain">Today's note keeps filling in as staff write. It locks for review at midnight.</div>`:st==='missing'?`<div class="explain">Can't approve until the items marked ! are fixed.</div>`:''}
  </aside>
 </div>`;
}
function oHouse(){
 const day=S.oday;
 return `<div class="pagehead"><div><h1>House log</h1><p class="sub">Chores, supplies and upkeep that aren't about one person. Kept for the house, never counted as a person's daily note.</p></div>${dayTabs()}</div>
 ${['maple','lehi'].map(p=>{const hs_=houseFor(day,p);return `<section class="panel"><div class="ph"><h2>${PLACES[p].n}</h2></div><div class="pb tl">${hs_.length?hs_.map(e=>vEntry(e,false)).join(''):'<p class="small muted">Nothing logged.</p>'}</div></section>`}).join('')}`;
}
function oSettings(){
 return `<div class="pagehead"><div><h1>Note settings</h1><p class="sub">Agency-wide. Changes apply to shifts that start after you save. Absence days now show on each home's page, and day program hours on the program's page, in the scheduler.</p></div></div>
 <section class="panel"><div class="ph"><div><h2>Note minimums</h2><p class="sub">Staff can't clock out until each client's section reaches the minimum, or they give a reason, or a supervisor overrides.</p></div></div><div class="pb col">
  <div class="field"><label for="setmin">Homes: words per client, per shift</label><input class="inp" id="setmin" type="number" min="5" max="200" value="${MIN}" style="max-width:120px"></div>
  <div class="field"><label for="setminr">Day programs: words per client response (the shared activity box uses the homes number)</label><input class="inp" id="setminr" type="number" min="5" max="200" value="${MIN_R}" style="max-width:120px"></div>
  <div><button class="btn pri" data-act="savemin">Save minimums</button></div></div></section>
 <section class="panel"><div class="ph"><div><h2>Day program start and end times</h2><p class="sub">Each client's own DSG/DSP start and end time (§7.3(6)). Van pickups and drop-offs are always kept as the MTP record (§13.3(3)).</p></div></div><div class="pb col">
  <div class="choice">${[['arrive','Arrived at program → Heading home (default)'],['van','Van pickup → van drop-off']].map(([k,l])=>`<button data-dsgm="${k}" aria-pressed="${S.dsgMode===k}">${l}</button>`).join('')}</div>
  <span class="hint">Van pickup → drop-off overlaps MTP transport time. Check with DSPD before choosing it (§2.1(5)(G)).</span></div></section>`;
}

/* ================= render & events ================= */
function render(){
 const st=S.mode==='phone';
 document.getElementById('app').innerHTML=`<div class="demo gut"><b>DEMO</b>
  <div class="seg">${[['phone','Staff phone'],['office','Office']].map(([k,l])=>`<button data-mode="${k}" aria-pressed="${S.mode===k}">${l}</button>`).join('')}</div>
  ${st?`<div class="seg">${[['sara','Sara · Maple 9a–3p'],['johnny','Johnny · Maple 3p–12a'],['priya','Priya · Lehi DSG']].map(([k,l])=>`<button data-me="${k}" aria-pressed="${S.me===k}">${l}</button>`).join('')}</div>`:''}
  <span class="xs" style="opacity:.7">Reload to reset</span></div>
  ${st?`<div class="phonewrap gut">${vPhone()}</div>`:vOffice()}${(st||S.sheet==='sendback')?vSheet():''}${S.toast?`<div class="toast" role="status">${esc(S.toast)}</div>`:''}`;
}
let tt;function toast(m){S.toast=m;render();clearTimeout(tt);tt=setTimeout(()=>{S.toast=null;render()},3200)}
function close(){S.sheet=null;S.sheetArg=null;S.statDraft=null;S.skipDraft=null;S.fixDraft=null;S.dtDraft=null;S.sbDraft=null;render()}

document.addEventListener('click',ev=>{
 const t=ev.target.closest('button,[data-act]');if(!t)return;const d=t.dataset;
 if(d.mode){S.mode=d.mode;S.sheet=null;render();return}
 if(d.me){S.me=d.me;S.sheet=null;render();return}
 if(d.op){S.opage=d.op;S.editing=false;render();return}
 if(d.oday){S.oday=d.oday;S.editing=false;render();return}
 if(d.oc){S.oc=d.oc;S.editing=false;render();return}
 if(d.ocode){S.ocode=d.ocode;S.editing=false;render();return}
 if(d.open){const [dy,c,cd]=d.open.split('|');S.oday=dy;S.oc=c;S.ocode=cd;S.opage='note';S.editing=false;render();window.scrollTo(0,0);return}
 if(d.sheet!==undefined){const [k,a]=d.sheet.split(/:(.*)/s);if(k==='entry'&&S.sheet!=='entry')S.draft={text:'',about:[],goals:{}};S.sheet=k||null;S.sheetArg=a||null;if(k==='status')S.statDraft=null;if(k==='nocome')S.dtDraft=null;render();if(k==='entry')focusText();return}
 if(d.tag){const dr=S.draft;const i=dr.about.indexOf(d.tag);if(i>=0){dr.about.splice(i,1);delete dr.goals[d.tag]}else dr.about.push(d.tag);render();return}
 if(d.goal){const [c,g]=d.goal.split('|');S.draft.goals[c]=S.draft.goals[c]===g?undefined:g;if(!S.draft.goals[c])delete S.draft.goals[c];render();return}
 if(d.st){S.statDraft.st=d.st;render();return}
 if(d.aw){const [i,v]=d.aw.split('|');S.statDraft.away[+i]=+v;render();return}
 if(d.why){S.statDraft.why=d.why;render();return}
 if(d.fx){S.fixDraft.t=+d.fx;render();return}
 if(d.dw){S.dtDraft.why=d.dw;render();return}
 if(d.dest){S.run.dest=d.dest;render();return}
 if(d.mv){const [dy,c,st]=d.mv.split('|');const std=Object.keys(GROUPS).find(k=>GROUPS[k].includes(c));if(st===std)delete S.move[dy+'|'+c];else S.move[dy+'|'+c]={to:st,why:`Moved from ${first(std)} by Dana Whit.`};toast(`${fn(c)} is with ${first(st)}`);return}
 if(d.sbw){S.sbDraft.why=d.sbw;render();return}
 if(d.dsgm){S.dsgMode=d.dsgm;toast(d.dsgm==='van'?'DSG now runs pickup to drop-off':'DSG now runs Arrived to Heading home');return}
 if(d.sgt){const [c,g]=d.sgt.split('|');const s=todayShift(S.me),x=secOf(s,c);x.tagGoal=x.tagGoal===g?null:g;upsert(s,c,'other',x.txt.other||'');render();return}
 if(d.sg){const [c,g]=d.sg.split('|');const s=todayShift(S.me),x=secOf(s,c);if(x.picked.includes(g)){x.picked=x.picked.filter(y=>y!==g);delete x.txt[g];upsert(s,c,g,'')}else x.picked.push(g);render();const t=document.getElementById(`t-${c}-${g}`);if(t)t.focus();return}
 const act=d.act;if(!act)return;const [a,arg]=act.split(/:(.*)/s);
 if(a==='close')return close();
 if(a==='clockin'){const s=SH(arg);S.clock[arg].in=s.a-0.03;toast(`Clocked in at ${hm(s.a-0.03)}`);return}
 if(a==='save'){
  const s=todayShift(S.me),dr=S.draft;const t=S.now[S.me];S.now[S.me]=Math.min(t+0.15,s.b-0.05);
  E.push({id:'n'+(EID++),place:s.place,day:'thu',t,staff:S.me,shift:s.id,about:[...dr.about],goals:{...dr.goals},text:dr.text.trim(),group:true});
  const who=dr.about.map(fn).join(', ');S.draft={text:'',about:[],goals:{}};S.sheet=null;toast(`Saved to ${who}'s daily notes`);return}
 if(a==='sendback'){const e=E.find(x=>x.id===arg),why=((document.getElementById('sbx')||{}).value||S.sbDraft.why).trim();e.sb={why,by:PLACES[e.place].lead};close();toast(`Sent back to ${first(e.staff)}`);return}
 if(a==='fixentry'){const e=E.find(x=>x.id===arg),v=document.getElementById('fxtext').value.trim();e.orig=e.orig||e.text;e.text=v;if(e.phr)e.phr={};const to=first(e.sb.by);delete e.sb;close();toast(`Sent to ${to} for review`);return}
 if(a==='ovask'){S.ovDraft=S.ovDraft===arg?null:arg;S.skipDraft=null;render();return}
 if(a==='ovok'){const why=(document.getElementById('ovwhy')||{}).value||'';if(!why.trim()){toast('Add the supervisor\'s reason first');return}const s=todayShift(S.me);S.skip[s.id+'|'+arg]=`Supervisor override by ${STAFF[PLACES[s.place].lead].n}: ${why.trim()}`;S.ovDraft=null;render();return}
 if(a==='savemin'){const a1=+document.getElementById('setmin').value,a2=+document.getElementById('setminr').value;if(!(a1>=5&&a2>=5)){toast('Minimums must be at least 5 words');return}MIN=a1;MIN_R=a2;toast('Minimums saved');return}
 if(a==='gosec'){S.sheet=null;S.skipDraft=null;render();const el=document.getElementById('sec-'+arg);if(el){el.scrollIntoView({block:'start'});const t=el.querySelector('textarea');if(t)t.focus({preventScroll:true})}return}
 if(a==='skipask'){S.skipDraft=S.skipDraft===arg?null:arg;render();return}
 if(a==='skip'){const [c,r]=arg.split('|');S.skip[todayShift(S.me).id+'|'+c]=r;S.skipDraft=null;render();return}
 if(a==='clockout'){const s=SH(arg);S.clock[arg].out=s.b;S.sheet=null;const cs=[...new Set(E.filter(e=>e.shift===arg&&Array.isArray(e.about)).flatMap(e=>e.about))].map(fn);toast(`Clocked out. Your entries are in ${cs.join(', ')||'the'} daily notes.`);return}
 if(a==='savestat'){const c=arg,sd=S.statDraft;const why=(document.getElementById('whyx')||{}).value||sd.why;
  RA['thu|'+c]=sd.st==='home'?{st:'home'}:sd.st==='away'?{st:'home',away:[...sd.away],why:'an outing'}:{st:'absent',why:why.trim(),by:S.me};
  if(CL[c].prog){const dg=DG['thu|'+c];if(sd.st==='absent')DG['thu|'+c]={absent:true,why:why.trim()+' (reported by Maple House)'};else if(dg&&dg.absent)DG['thu|'+c]={in:null,out:null};}
  close();toast(`${fn(c)} updated`);return}
 if(a==='pick'){const c=arg,t=S.now.priya;S.now.priya+=0.2;DG['thu|'+c]={in:t,out:null,am:[CL[c].homeAddr,t,null,null],pm:null,driver:'priya'};toast(`${fn(c)} picked up at ${hm(t)}`);return}
 if(a==='nocome'){DG['thu|'+arg]={absent:true,why:S.dtDraft.why};close();toast(`${fn(arg)} marked absent`);return}
 if(a==='arrive'){const t=S.now.priya;S.run.stage='day';S.run.arrive=t;const dest=S.run.dest.replace('Community outing: ','');ROUTE.forEach(c=>{const x=DG['thu|'+c];if(x&&x.am){x.am[2]=dest;x.am[3]=t}});S.now.priya=Math.max(t+0.1,10);toast(`Arrived at ${dest} at ${hm(t)}`);return}
 if(a==='leave'){const t=14.75;S.run.stage='pm';S.run.leave=t;S.now.priya=t+0.25;const dest=S.run.dest.replace('Community outing: ','');ROUTE.forEach(c=>{const x=DG['thu|'+c];if(x&&x.in!=null&&!x.absent)x.pm=[dest,t,CL[c].homeAddr,null]});toast(`Left ${dest} at ${hm(t)}. Demo clock jumped ahead.`);return}
 if(a==='drop'){const c=arg,t=S.now.priya;S.now.priya+=0.25;const x=DG['thu|'+c];x.out=t;x.pm[3]=t;if(ROUTE.every(r=>{const y=DG['thu|'+r];return assigned('thu',r)!=='priya'||y.absent||y.out!=null}))S.run.stage='done';toast(`${fn(c)} dropped off at ${hm(t)}`);return}
 if(a==='approve'){S.approved[arg]=true;toast('Approved');return}
 if(a==='approveall'){const p=arg;let n=0;notesOf(p).forEach(x=>{if(status('wed',x.c,x.code,p)==='ready'){S.approved[nkey('wed',x.c,x.code)]=true;n++}});toast(`Approved ${n} notes`);return}
 if(a==='edit'){S.editing=!S.editing;render();return}
 if(a==='saveedit'){const v=document.getElementById('sumedit').value;const [dy,c,cd]=arg.split('|');S.edited[arg]={text:v,by:PLACES[cd==='RHS'?'maple':'lehi'].lead};S.editing=false;toast('Summary saved');return}
 if(a==='savefix'){const fd=S.fixDraft;const dg=DG['wed|hazel'];dg.out=fd.t;dg.pm=['Lehi Day Program',fd.t,'Home (American Fork)',fd.t+0.4];dg.fix={by:'dana',why:fd.why};close();toast('Departure time added by Dana');return}
});
let gateOpenAfter=false;function reopenGate(){}
document.addEventListener('input',ev=>{
 if(ev.target.dataset&&ev.target.dataset.sec){const [c,slot]=ev.target.dataset.sec.split('|');const s=todayShift(S.me),x=secOf(s,c);x.txt[slot]=ev.target.value;upsert(s,c,slot,ev.target.value);const st=secState(s,c),el=document.getElementById('st-'+c);if(el)el.innerHTML=pill(st.ok?'ok':'warn',st.lab);return}
 if(ev.target.id==='actbox'){const s=todayShift(S.me);upsert(s,'group','act',ev.target.value);const w=words(ev.target.value),el=document.getElementById('st-act');if(el)el.innerHTML=pill(w>=MIN?'ok':'warn',w>=MIN?`✓ ${w} words`:`${w} of ${MIN} words`);return}
 if(ev.target.id==='housebox'){upsert(todayShift(S.me),'house','house',ev.target.value);return}
 if(ev.target.id==='etext'){S.draft.text=ev.target.value;const w=words(S.draft.text),isH=false;
  const wc=document.getElementById('wc');if(wc)wc.textContent=w<MIN?`${w} of ${MIN} words.`:'Good.';
  const sv=document.querySelector('[data-act="save"]');if(sv)sv.disabled=!(S.draft.about.length>=2&&w>=MIN);}
 if(ev.target.id==='sbx'&&S.sbDraft){S.sbDraft.why=ev.target.value;const b=document.querySelector('[data-act^="sendback:"]');if(b)b.disabled=!ev.target.value.trim();}
 if(ev.target.id==='fxtext'){const b=document.getElementById('fxsave'),w=words(ev.target.value);document.getElementById('fxwc').textContent=w+' words';if(b)b.disabled=!ev.target.value.trim();}
 if(ev.target.id==='whyx'&&S.statDraft){S.statDraft.why=ev.target.value;const b=document.querySelector('[data-act^="savestat"]');if(b)b.disabled=S.statDraft.st==='absent'&&!ev.target.value.trim();}
 if(ev.target.id==='fxwhy'&&S.fixDraft){S.fixDraft.why=ev.target.value;const b=document.querySelector('[data-act="savefix"]');if(b)b.disabled=!ev.target.value.trim();}
});
function focusText(){const t=document.getElementById('etext');if(t){t.focus();t.setSelectionRange(t.value.length,t.value.length)}}
render();
</script>
